<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TecnoShop - Cupón de descuento</title>
<link rel="stylesheet" href="/css/estilos.css" />
</head>
<body>
<header><div class="brand">TecnoShop</div><div class="badge">VERSIÓN VULNERABLE</div></header>
<div class="wrap">
  <section id="shopView" class="card">
    <h2>Tu orden</h2>
    <div class="product">
      <div class="thumb">LAP</div>
      <div style="flex:1"><div style="font-weight:600">Laptop Gamer</div><div class="muted">Cantidad: 1</div></div>
      <div style="font-weight:600">$1,000.00</div>
    </div>
    <div class="row"><span class="muted">Subtotal</span><span id="subtotal">$1,000.00</span></div>
    <div class="row"><span class="muted">Descuento</span><span id="descuento">-$0.00</span></div>
    <div class="row total"><span>Total</span><span id="total">$1,000.00</span></div>
    <div class="meter"><div id="meter"></div></div>
    <div class="muted" style="font-size:12px;margin-top:4px">Se cobrará el <b id="pct">100%</b> del precio original.</div>
    <div class="form">
      <input id="code" placeholder="Código de cupón" value="PROMO20" aria-label="Código de cupón" />
      <button class="primary" style="width:auto" id="apply">Aplicar</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
    <div class="actions"><button id="pay">Pagar</button><button id="reset">Reiniciar orden</button></div>
    <div class="hint">Cupón de demostración: <b>PROMO20</b> (20% de descuento)</div>
  </section>
</div>
<script src="/js/app.js"></script>
</body>
</html>
